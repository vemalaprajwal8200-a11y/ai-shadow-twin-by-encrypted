<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 - Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="/theme.css" />
<link href="https://fonts.googleapis.com/css2?family=Arvo&family=Roboto:wght@300&display=swap" rel="stylesheet" />
<style>
  :root {
    --color-primary: var(--rgb-primary);
    --color-primary-light: var(--rgb-accent);
    --color-surface-tint: var(--rgb-soft);
    --color-ink: var(--rgb-text);
    --color-page: var(--rgb-bg);
    --color-white: var(--rgb-card);
    --color-muted: var(--rgb-muted);
    --color-ambiguous: var(--rgb-ambiguous);
    --t: 9s;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: rgb(var(--color-page)); color: rgb(var(--color-ink)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; font-family: "Roboto", "Helvetica Neue", Arial, sans-serif; }
  h1 { font-weight: 300; font-size: clamp(64px, 14vw, 120px); line-height: 1; letter-spacing: .02em; }
  h1 span { display: inline-block; animation: drop .9s cubic-bezier(.2,.9,.3,1.3) both, float 4s 1.2s ease-in-out infinite; }
  h1 span:nth-child(2) { animation-delay: .12s, 1.6s; }
  h1 span:nth-child(3) { animation-delay: .24s, 2s; }
  .scene { width: 100%; max-width: 600px; margin-top: 8px; animation: scene-in .9s .35s ease both; }
  .scene svg { width: 100%; height: auto; display: block; overflow: visible; }
  h2 { font-family: "Arvo", Georgia, serif; font-weight: 400; font-size: clamp(20px, 4vw, 26px); margin-top: 6px; animation: rise .8s .3s ease both; }
  p { font-family: "Arvo", Georgia, serif; font-size: 14px; color: rgb(var(--color-muted)); margin-top: 8px; animation: rise .8s .45s ease both; }
  .btn { display: inline-block; margin-top: 22px; padding: 11px 22px; border-radius: 3px; background: rgb(var(--color-primary)); color: rgb(var(--color-white)); text-decoration: none; font-family: "Arvo", Georgia, serif; font-size: 14px; transition: background .2s, transform .2s; animation: rise .8s .6s ease both; }
  .btn:hover { background: rgb(var(--color-ink)); transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid rgb(var(--color-primary-light)); outline-offset: 3px; }

  /* every scene animation below shares one 9s timeline so the story stays in sync */
  .fb { transform-box: fill-box; transform-origin: center; }
  .shaker { transform-origin: 300px 200px; animation: shake var(--t) ease-in-out infinite; }
  .head { transform-origin: 300px 102px; animation: nod var(--t) ease-in-out infinite; }
  .blink { animation: blink 4s infinite; }
  .eyes { animation: wide var(--t) ease-in-out infinite; }
  .pupil { animation: look var(--t) ease-in-out infinite; }
  .mopen { opacity: 0; animation: mopen var(--t) linear infinite; }
  .spikes { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: spikes var(--t) ease-out infinite; }
  .bolt { opacity: 0; animation: zap var(--t) linear infinite; }
  .bolt.b { animation-delay: .07s; }
  .aura { opacity: 0; animation: aura var(--t) linear infinite; }
  .flash { opacity: 0; animation: flash var(--t) linear infinite; pointer-events: none; }
  .smoke { opacity: 0; animation: smoke var(--t) ease-out infinite; }
  .q { opacity: 0; animation: q var(--t) ease-out infinite; }
  .tspark { opacity: 0; animation: tspark 2.6s infinite; }
  .pulse { stroke-dasharray: 4 96; animation: pulse 1.8s linear infinite; }
  .bush { transform-box: fill-box; transform-origin: 50% 100%; animation: bush 3s ease-in-out infinite; }
  .rocks { transform-box: fill-box; transform-origin: 50% 100%; animation: rocks 5s ease-in-out infinite; }

  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-40px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes scene-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes bush { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes rocks { 0%,100% { transform: rotate(-.8deg); } 50% { transform: rotate(.8deg); } }
  @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes pulse { to { stroke-dashoffset: -100; } }
  @keyframes tspark { 0%,70%,100% { opacity: 0; transform: scale(.3); } 75% { opacity: 1; transform: scale(1.2); } 82% { opacity: .2; } 88% { opacity: 1; transform: scale(.9); } 95% { opacity: 0; } }
  @keyframes shake {
    0%,39% { transform: rotate(0); } 40% { transform: rotate(2.5deg); } 41% { transform: rotate(-2.5deg); } 42% { transform: rotate(3deg); }
    43% { transform: rotate(-3deg); } 44% { transform: rotate(2.5deg); } 45% { transform: rotate(-2.5deg); } 46% { transform: rotate(3deg); }
    47% { transform: rotate(-3deg); } 48% { transform: rotate(2.5deg); } 49% { transform: rotate(-2.5deg); } 50% { transform: rotate(2deg); }
    51% { transform: rotate(-2deg); } 52% { transform: rotate(1.5deg); } 53% { transform: rotate(-1.5deg); } 54% { transform: rotate(1deg); }
    55% { transform: rotate(-1deg); } 56% { transform: rotate(0); } 58% { transform: rotate(-6deg); } 62% { transform: rotate(4deg); }
    66% { transform: rotate(-2deg); } 70%,100% { transform: rotate(0); }
  }
  @keyframes nod {
    0%,100% { transform: rotate(0); } 8%,15% { transform: rotate(-6deg); } 19%,26% { transform: rotate(6deg); } 32% { transform: rotate(0); }
    39% { transform: rotate(-3deg); } 40% { transform: rotate(5deg); } 46% { transform: rotate(-5deg); } 52% { transform: rotate(4deg); }
    56% { transform: rotate(0); } 62%,74% { transform: rotate(9deg); } 82% { transform: rotate(0); }
  }
  @keyframes look {
    0%,100% { transform: translateX(0) scale(1); } 8%,15% { transform: translateX(-1.6px) scale(1); } 19%,30% { transform: translateX(1.6px) scale(1); }
    39% { transform: translateX(1px) scale(1); } 40%,56% { transform: translateX(0) scale(.45); } 60% { transform: translateX(0) scale(1); }
    66% { transform: translateX(-1.6px) scale(1); } 72% { transform: translateX(1.6px) scale(1); } 78% { transform: translateX(0) scale(1); }
  }
  @keyframes wide { 0%,39%,60%,100% { transform: scale(1); } 40%,56% { transform: scale(1.55); } }
  @keyframes mopen { 0%,32%,62%,100% { opacity: 0; } 36%,58% { opacity: 1; } }
  @keyframes spikes { 0%,39%,60%,100% { transform: scaleY(0); } 41% { transform: scaleY(1.15); } 44%,56% { transform: scaleY(1); } }
  @keyframes zap {
    0%,39.9%,100% { opacity: 0; } 40% { opacity: 1; } 41% { opacity: 0; } 42% { opacity: 1; } 43% { opacity: 0; } 44% { opacity: 1; }
    45.5% { opacity: 0; } 46.5% { opacity: 1; } 47.5% { opacity: 0; } 49% { opacity: 1; } 50% { opacity: 0; } 51.5% { opacity: 1; }
    52.5% { opacity: 0; } 54% { opacity: 1; } 55% { opacity: 0; }
  }
  @keyframes aura { 0%,39.9%,56%,100% { opacity: 0; } 40% { opacity: .55; } 42% { opacity: .25; } 44% { opacity: .55; } 46% { opacity: .2; } 48% { opacity: .5; } 50% { opacity: .2; } 52% { opacity: .4; } }
  @keyframes flash { 0%,39.9%,100% { opacity: 0; } 40% { opacity: .7; } 41.5% { opacity: 0; } 43% { opacity: .45; } 44% { opacity: 0; } 47% { opacity: .35; } 48% { opacity: 0; } }
  @keyframes smoke {
    0%,56%,100% { opacity: 0; transform: translate(0,0) scale(.4); } 62% { opacity: .7; }
    80% { opacity: 0; transform: translate(var(--dx),-34px) scale(1.7); }
  }
  @keyframes q {
    0%,5%,24%,82%,98%,100% { opacity: 0; transform: scale(.3); } 8% { opacity: 1; transform: scale(1.25); }
    11%,21% { opacity: 1; transform: scale(1); } 86%,94% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <h1 aria-label="404"><span aria-hidden="true">4</span><span aria-hidden="true">0</span><span aria-hidden="true">4</span></h1>

  <div class="scene">
    <svg viewBox="0 0 600 230" role="img" aria-label="A caveman holding two ends of a cut wire that runs through a door and behind the rocks; he puts one end in his mouth and gets a shock">
      <!-- door the wire passes through -->
      <path d="M12 200 V150 Q12 138 24 138 H40 Q52 138 52 150 V200 Z" fill="rgb(var(--color-primary))"/>
      <path d="M32 138 V200 M12 168 H52" stroke="rgb(var(--color-ink))" stroke-width="1.5" fill="none"/>
      <circle cx="44" cy="172" r="2" fill="rgb(var(--color-ambiguous))"/>
      <ellipse cx="32" cy="198" rx="5" ry="3" fill="rgb(var(--color-ink))"/>

      <!-- wire: door -> behind left rocks -> cut end in left hand | cut end in right hand -> behind right rock -->
      <g fill="none" stroke-linecap="round">
        <path d="M32 198 C90 202 150 197 205 200 S240 199 250 199" stroke="rgb(var(--color-ink))" stroke-width="3"/>
        <path class="pulse" pathLength="100" d="M32 198 C90 202 150 197 205 200 S240 199 250 199" stroke="rgb(var(--color-ambiguous))" stroke-width="1.6"/>
        <path d="M600 199 C540 203 470 197 425 200 S390 199 380 200" stroke="rgb(var(--color-ink))" stroke-width="3"/>
        <path class="pulse" pathLength="100" style="animation-delay:-.9s" d="M600 199 C540 203 470 197 425 200 S390 199 380 200" stroke="rgb(var(--color-ambiguous))" stroke-width="1.6"/>
      </g>

      <!-- rocks (wire runs behind them) -->
      <g class="rocks">
        <ellipse cx="105" cy="190" rx="40" ry="14" fill="rgb(var(--color-surface-tint))"/>
        <ellipse cx="105" cy="168" rx="30" ry="13" fill="rgb(var(--color-white))"/>
        <ellipse cx="103" cy="148" rx="20" ry="11" fill="rgb(var(--color-surface-tint))"/>
        <ellipse cx="103" cy="133" rx="10" ry="8" fill="rgb(var(--color-white))"/>
      </g>
      <path d="M448 204 C440 130 452 62 498 62 C544 62 556 130 548 204 Z" fill="rgb(var(--color-surface-tint))"/>

      <!-- bushes -->
      <g class="bush" fill="rgb(var(--color-primary-light))"><circle cx="72" cy="198" r="7"/><circle cx="86" cy="194" r="9"/></g>
      <g class="bush" fill="rgb(var(--color-primary-light))" style="animation-delay:-1s"><circle cx="205" cy="197" r="8"/><circle cx="218" cy="192" r="11"/><circle cx="232" cy="198" r="7"/></g>
      <g class="bush" fill="rgb(var(--color-primary-light))" style="animation-delay:-2s"><circle cx="402" cy="198" r="7"/><circle cx="415" cy="193" r="11"/><circle cx="430" cy="198" r="8"/></g>
      <g class="bush" fill="rgb(var(--color-primary-light))" style="animation-delay:-.5s"><circle cx="566" cy="198" r="8"/><circle cx="579" cy="194" r="10"/></g>

      <ellipse cx="300" cy="203" rx="46" ry="6" fill="rgb(var(--color-ink))" opacity=".08"/>

      <!-- caveman -->
      <g class="shaker">
        <circle class="aura" cx="300" cy="120" r="64" fill="rgb(var(--color-surface-tint))"/>

        <!-- right wire end (follows the right hand) -->
        <path d="M350 142 C352 170 368 198 380 200" fill="none" stroke="rgb(var(--color-ink))" stroke-width="3" stroke-linecap="round">
          <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.22;0.38;0.56;0.62;1"
            keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
            values="M350 142 C352 170 368 198 380 200;M350 142 C352 170 368 198 380 200;M306 108 C318 146 352 186 380 200;M306 108 C318 146 352 186 380 200;M350 142 C352 170 368 198 380 200;M350 142 C352 170 368 198 380 200"/>
        </path>
        <!-- left wire end (in left hand) -->
        <path d="M264 150 C263 172 258 194 250 199" fill="none" stroke="rgb(var(--color-ink))" stroke-width="3" stroke-linecap="round"/>

        <!-- legs, feet -->
        <path d="M289 160 L287 198" stroke="rgb(var(--color-primary-light))" stroke-width="10" stroke-linecap="round"/>
        <path d="M312 160 L314 198" stroke="rgb(var(--color-primary-light))" stroke-width="10" stroke-linecap="round"/>
        <ellipse cx="285" cy="200" rx="9" ry="4" fill="rgb(var(--color-primary-light))"/>
        <ellipse cx="317" cy="200" rx="9" ry="4" fill="rgb(var(--color-primary-light))"/>

        <!-- left arm, hand and cut end -->
        <path d="M280 114 Q268 124 264 146" fill="none" stroke="rgb(var(--color-primary-light))" stroke-width="8" stroke-linecap="round"/>
        <circle cx="264" cy="148" r="5" fill="rgb(var(--color-primary-light))"/>
        <path d="M264 143 l-3 -8 M264 143 l1 -9 M264 143 l4 -7" stroke="rgb(var(--color-ambiguous))" stroke-width="1.4" stroke-linecap="round"/>
        <polygon class="tspark fb" fill="rgb(var(--color-ambiguous))" points="262,128 263.5,132 267.5,133.5 263.5,135 262,139 260.5,135 256.5,133.5 260.5,132"/>

        <!-- chest, tunic -->
        <ellipse cx="300" cy="110" rx="20" ry="7" fill="rgb(var(--color-primary-light))"/>
        <path d="M279 112 Q300 106 321 112 L329 165 L321 157 L313 166 L305 157 L297 166 L289 157 L281 166 Z" fill="rgb(var(--color-primary))"/>
        <g fill="rgb(var(--color-ink))"><circle cx="292" cy="125" r="3"/><circle cx="310" cy="132" r="3.5"/><circle cx="300" cy="146" r="3"/><circle cx="317" cy="150" r="2.5"/><circle cx="287" cy="151" r="2.5"/></g>

        <!-- head -->
        <g class="head">
          <g class="spikes"><polygon fill="rgb(var(--color-ink))" points="286,72 288,52 294,68 297,66 300,46 304,66 307,68 312,52 314,72"/></g>
          <circle cx="300" cy="86" r="17" fill="rgb(var(--color-primary-light))"/>
          <path d="M282 84 C280 62 320 62 318 84 C312 74 288 74 282 84 Z" fill="rgb(var(--color-ink))"/>
          <path d="M284 88 C284 112 316 112 316 88 C310 96 290 96 284 88 Z" fill="rgb(var(--color-ink))"/>
          <g class="blink fb"><g class="eyes fb">
            <circle cx="294" cy="84" r="3.3" fill="rgb(var(--color-white))"/><circle cx="306" cy="84" r="3.3" fill="rgb(var(--color-white))"/>
            <circle class="pupil fb" cx="294" cy="84" r="1.7" fill="rgb(var(--color-ink))"/><circle class="pupil fb" cx="306" cy="84" r="1.7" fill="rgb(var(--color-ink))"/>
          </g></g>
          <ellipse cx="300" cy="89" rx="2.6" ry="2" fill="rgb(var(--color-primary-light))"/>
          <path d="M296 97 Q300 100 304 97" stroke="rgb(var(--color-primary-light))" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <ellipse class="mopen" cx="300" cy="98" rx="3.2" ry="3.6" fill="rgb(var(--color-ink))"/>
        </g>

        <!-- right arm reaches for his mouth -->
        <path d="M321 114 Q340 120 350 138" fill="none" stroke="rgb(var(--color-primary-light))" stroke-width="8" stroke-linecap="round">
          <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.22;0.38;0.56;0.62;1"
            keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
            values="M321 114 Q340 120 350 138;M321 114 Q340 120 350 138;M321 114 Q338 100 306 104;M321 114 Q338 100 306 104;M321 114 Q340 120 350 138;M321 114 Q340 120 350 138"/>
        </path>
        <g>
          <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.22;0.38;0.56;0.62;1"
            keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" values="0 0;0 0;-44 -34;-44 -34;0 0;0 0"/>
          <circle cx="350" cy="138" r="5" fill="rgb(var(--color-primary-light))"/>
          <path d="M350 133 l-6 -5 M350 133 l-3 -8 M350 133 l-8 -2" stroke="rgb(var(--color-ambiguous))" stroke-width="1.4" stroke-linecap="round"/>
          <polygon class="tspark fb" style="animation-delay:-1.3s" fill="rgb(var(--color-ambiguous))" points="342,120 343.5,124 347.5,125.5 343.5,127 342,131 340.5,127 336.5,125.5 340.5,124"/>
          <polygon class="bolt fb" fill="rgb(var(--color-surface-tint))" points="341,114 344,122 351,124 344,127 341,136 338,127 331,124 338,122"/>
        </g>

        <!-- electric bolts -->
        <g fill="none" stroke="rgb(var(--color-ambiguous))" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline class="bolt" points="268,62 278,74 271,76 282,90"/>
          <polyline class="bolt b" points="334,58 324,72 331,74 320,90"/>
          <polyline class="bolt" points="288,150 296,138 291,136 300,122"/>
          <polyline class="bolt b" points="352,150 344,138 349,136 340,122"/>
        </g>

        <!-- smoke and confusion -->
        <g fill="rgb(var(--color-primary-light))">
          <circle class="smoke fb" cx="300" cy="56" r="6" style="--dx:-6px"/>
          <circle class="smoke fb" cx="292" cy="60" r="4.5" style="--dx:-14px;animation-delay:.25s"/>
          <circle class="smoke fb" cx="309" cy="58" r="5" style="--dx:10px;animation-delay:.45s"/>
        </g>
        <text class="q fb" x="322" y="58" font-size="24" font-family="Arvo, Georgia, serif" fill="rgb(var(--color-ink))" text-anchor="middle">?</text>
      </g>

      <rect class="flash" x="-20" y="-20" width="640" height="270" fill="rgb(var(--color-surface-tint))"/>
    </svg>
  </div>

  <h2>Looks like you're lost</h2>
  <p>The page you are looking for is not available!</p>
  <a class="btn" href="/">Go to Home</a>
<script>
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var s = document.querySelector("svg");
    if (s && s.pauseAnimations) s.pauseAnimations();
  }
</script>
</body>
</html>
